    <line x1="256" y1="36" x2="256" y2="4"/><line x1="412" y1="124" x2="442" y2="106"/><line x1="412" y1="304" x2="442" y2="322"/>
    <line x1="100" y1="124" x2="70" y2="106"/><line x1="100" y1="304" x2="70" y2="322"/><line x1="256" y1="394" x2="256" y2="430"/>
  </g>
  <g fill="#12253A" stroke="#0099FF" stroke-width="2">
    <circle cx="256" cy="2" r="5"/><circle cx="443" cy="106" r="5"/><circle cx="443" cy="323" r="5"/>
    <circle cx="68" cy="106" r="5"/><circle cx="68" cy="323" r="5"/><circle cx="256" cy="431" r="5"/>
  </g>
